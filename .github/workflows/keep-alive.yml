# Hanvika app - daily automatic check
# Every day at about 6 am (India time) GitHub calls the app's database once. This keeps the free
# Supabase project from pausing, and saves the day's full online copy (Settings -> Backup -> Online copies)
# even when nobody opens the app.
# To run it by hand: Actions tab -> "Daily database check" -> "Run workflow".
name: Daily database check
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the database and save today's copy
        run: |
          for i in 1 2 3; do
            if curl -sS --fail-with-body --max-time 60 -X POST \
                 "https://xwszjiokhvotajqelbwb.supabase.co/rest/v1/rpc/keep_alive" \
                 -H "apikey: sb_publishable_i9IokGrLlBQ2Yk9O42qz-A_nXiiTKvZ" \
                 -H "Content-Type: application/json" -d '{}'; then
              echo; echo "OK"; exit 0
            fi
            echo "Try $i did not work - waiting a minute"; sleep 60
          done
          echo "The database did not answer. Open supabase.com - if the project is paused, press Resume project."
          exit 1
      - name: Keep this daily schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable" || true
